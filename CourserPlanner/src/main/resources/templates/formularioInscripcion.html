<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Nueva Inscripción</title>
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <div th:replace="~{fragments/cabecera :: cabecera}"></div>

    <main class="flex-grow-1 py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card shadow-sm border-0 p-4">
                        <div class="card-body">
                            <h2 class="mb-2 fw-bold text-primary">Registrar Inscripción</h2>
                            <p class="text-muted mb-4">Confirma tu inscripción al curso seleccionado.</p>

                            <div th:if="${curso != null}" class="card mb-4 border-0 bg-white shadow-sm">
                                <div class="card-body p-3">
                                    <div class="row align-items-center">
                                        <div class="col-md-3">
                                            <img th:src="${curso.fotoCurso != null and !#strings.isEmpty(curso.fotoCurso) and (#strings.startsWith(curso.fotoCurso, 'http') or #strings.startsWith(curso.fotoCurso, '/')) ? curso.fotoCurso : '/img/logo.png'}" class="img-fluid rounded shadow-sm" alt="Imagen del curso">
                                        </div>
                                        <div class="col-md-9">
                                            <h4 class="card-title fw-bold" th:text="${curso.titulo}">Título del Curso</h4>
                                            
                                            <div class="mt-3">
                                                <p class="mb-1 text-secondary">Precio original: 
                                                    <span class="text-decoration-line-through" th:text="${#numbers.formatDecimal(curso.precio, 1, 'POINT', 2, 'COMMA')} + '€'"></span>
                                                </p>
                                                
                                                <p class="mb-1" th:if="${curso.descuento > 0}">
                                                    Descuento: <span class="text-danger fw-bold" th:text="'-' + ${#numbers.formatInteger(curso.descuento, 0)} + '%'"></span>
                                                </p>
                                                
                                                <hr class="my-2">
                                                
                                                <p class="h5 mb-0">
                                                    Subtotal: 
                                                    <span class="text-success fw-bold" 
                                                          th:text="${#numbers.formatDecimal(curso.precio - (curso.precio * curso.descuento / 100), 1, 'POINT', 2, 'COMMA')} + '€'">
                                                    </span>
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <form method="post" th:action="@{/inscripcion/nuevainscripcion/submit}" th:object="${inscripcion}">
                                <input type="hidden" th:field="*{inscripcionPK.cursoId}">

                                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                    <a th:href="@{/catalogo}" class="btn btn-outline-secondary px-4">Cancelar</a>
                                    <button type="submit" class="btn btn-success px-4 shadow-sm">
                                        <i class="bi bi-check-circle-fill"></i> Confirmar Inscripción
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/pieDePagina :: pieDePagina}"></div>

</body>
</html>
