<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Formulario de Instructor</title>
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <main class="flex-grow-1 py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="card shadow-sm border-0 p-4">
                        <div class="card-body">
                            <h2 class="mb-2"
                                th:text="${instructor.dni != null} ? 'Editar Instructor' : 'Registro de Instructor'">
                                Registro de Instructor</h2>
                            <p class="text-muted mb-4">Introduce los datos para gestionar al instructor.</p>

                            <form method="post"
                                th:action="${instructor.dni != null} ? @{/editarInstructor/submit} : @{/crearInstructor}"
                                th:object="${instructor}">

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-secondary fw-bold">DNI:</label>
                                        <input type="text" th:field="*{dni}" class="form-control"
                                            placeholder="12345678X" required th:readonly="${instructor.dni != null}">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-secondary fw-bold">Foto Perfil:</label>
                                        <input type="text" th:field="*{foto}" class="form-control"
                                            placeholder="http://imagen.jpg">
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-secondary fw-bold">Nombre de Usuario:</label>
                                        <input type="text" th:field="*{username}" class="form-control"
                                            placeholder="Ej: Juan" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-secondary fw-bold">Apellidos:</label>
                                        <input type="text" th:field="*{apellidos}" class="form-control"
                                            placeholder="Ej: Pérez García" required>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-secondary fw-bold">Correo Electrónico:</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                            <input type="email" th:field="*{email}" class="form-control"
                                                placeholder="ejemplo@correo.com" required>
                                        </div>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-secondary fw-bold">Contraseña:</label>
                                        <input type="password" th:field="*{password}" class="form-control"
                                            placeholder="••••••••" required>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-secondary fw-bold">Teléfono:</label>
                                        <input type="tel" th:field="*{telefono}" class="form-control"
                                            placeholder="Ej: 600123456" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-secondary fw-bold">Fecha Nacimiento:</label>
                                        <input type="date" th:field="*{fechaNacimiento}" class="form-control" required>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-secondary fw-bold">Especialidad:</label>
                                        <input type="text" th:field="*{especialidad}" class="form-control" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-secondary fw-bold">Rol:</label>
                                        <select th:field="*{rol}" class="form-select" required>
                                            <option value="ADMIN">Administrador</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                    <a th:href="@{/}" class="btn btn-outline-secondary px-4">Cancelar</a>
                                    <button type="submit" class="btn btn-success px-4">
                                        <i class="bi bi-check-circle"></i>
                                        <span th:text="${instructor.dni != null} ? 'Guardar Cambios' : 'Registrar Instructor'">Registrar</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/pieDePagina :: pieDePagina}"></div>
   
</body>

</html>
