<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Lista de Estudiantes</title>
</head>

<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/cabecera :: cabecera}"></div>

    <main class="container my-5 flex-grow-1">

        <div class="container mt-4 mb-5">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2>Lista de Estudiantes</h2>
                <a th:href="@{/anadirestudiante}" class="btn btn-success rounded-pill btn-sm px-3">
                    <i class="bi bi-plus-circle me-1"></i> Añadir Estudiante
                </a>
            </div>

            <table class="table align-middle border-bottom">
                <thead class="table-light">
                    <tr>
                        <th class="text-muted">DNI</th>
                        <th class="text-muted">Username</th>
                        <th class="text-muted">Apellidos</th>
                        <th class="text-muted">Email</th>
                        <th class="text-muted text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="estudiante : ${estudiantes}">
                        <td th:text="${estudiante.dni}">87654321B</td>
                        <td th:text="${estudiante.username}">user</td>
                        <td th:text="${estudiante.apellidos}">user</td>
                        <td th:text="${estudiante.email}">usser@user.com</td>

                        <td class="text-center">
                            <a th:href="@{/admin/estudiante/detalle/{id}(id=${estudiante.dni})}"
                                class="btn btn-outline-info btn-sm">Detalle</a>
                            <a th:href="@{/admin/estudiante/editar/{id}(id=${estudiante.dni})}"
                                class="btn btn-outline-primary btn-sm ms-2">Editar</a>
                            <button type="button" class="btn btn-outline-danger btn-sm ms-2" data-bs-toggle="modal"
                                data-bs-target="#delete-modal" th:data-bs-id="${estudiante.dni}">Borrar</button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(estudiantes)}">
                        <td colspan="5" class="text-center text-muted py-4">No hay estudiantes registrados.</td>
                    </tr>
                </tbody>
            </table>

        </div>

        <div class="modal fade" id="delete-modal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Confirmar Borrado</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        ¿Está seguro de que desea eliminar este estudiante?
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <a id="confirmDeleteBtn" href="#" class="btn btn-danger">Eliminar</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/pieDePagina :: pieDePagina}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const deleteModal = document.getElementById('delete-modal');
        if (deleteModal) {
            deleteModal.addEventListener('show.bs.modal', event => {
                const button = event.relatedTarget;
                const id = button.getAttribute('data-bs-id');
                const confirmBtn = deleteModal.querySelector('#confirmDeleteBtn');
                confirmBtn.href = '/admin/estudiante/borrar/' + id;
            });
        }
    </script>
</body>
</html>
