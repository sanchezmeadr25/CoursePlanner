<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoursePlanner - Iniciar Sesión</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        /* Ocupar todo el alto de la pantalla sin scrollbars raros */
        .full-height-row {
            min-height: 100vh;
        }
        /* Un pequeño ajuste de opacidad para el degradado izquierdo usando el color Minty de fondo */
        .bg-minty-gradient {
            background-image: linear-gradient(135deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.1) 100%);
        }
    </style>
</head>
<body class="bg-light">

    <div class="container-fluid p-0">
        <div class="row g-0 full-height-row">
            
            <div class="col-lg-6 bg-primary bg-minty-gradient d-none d-lg-flex flex-column align-items-center justify-content-center text-white p-5">
                <div class="text-center">
                    <i class="bi bi-laptop mb-4" style="font-size: 9rem; opacity: 0.85;"></i>
                    <h1 class="display-3 fw-bold mb-3">CoursePlanner</h1>
                    <p class="fs-4 opacity-75 mx-auto" style="max-width: 460px;">
                        La plataforma tecnológica para dominar tu futuro académico y profesional.
                    </p>
                </div>
            </div>

            <div class="col-lg-6 d-flex align-items-center justify-content-center bg-white p-5">
                <div class="w-100" style="max-width: 400px;">
                    
                    <div class="text-center d-lg-none mb-4">
                        <h2 class="fw-bold text-primary mb-1">CoursePlanner</h2>
                        <i class="bi bi-laptop text-primary" style="font-size: 3rem;"></i>
                    </div>

                    <div class="mb-4">
                        <h3 class="fw-bold text-dark mb-1">Bienvenido de nuevo</h3>
                        <p class="text-muted">Introduce tus credenciales para gestionar tus cursos</p>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger p-2 small mb-3" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i> Usuario o contraseña incorrectos.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success p-2 small mb-3" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i> Sesión cerrada correctamente.
                    </div>

                    <form th:action="@{/acceso}" method="post">
                        
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="username" name="username" placeholder="Usuario" required autofocus>
                            <label for="username"><i class="bi bi-person text-muted me-2"></i>Nombre de usuario</label>
                        </div>
                        
                        <div class="form-floating mb-4">
                            <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" required>
                            <label for="password"><i class="bi bi-lock text-muted me-2"></i>Contraseña</label>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm mb-4 text-white">
                            Entrar <i class="bi bi-box-arrow-in-right ms-2"></i>
                        </button>
                        
                    </form>

                    <div class="text-center border-top pt-4">
                        <p class="mb-2 text-muted small">¿No tienes cuenta todavía?</p>
                        <a th:href="@{/registro/seleccion}" class="btn btn-outline-danger">Crear una cuenta nueva</a>
                    </div>
                    
                </div>
            </div>

        </div>
    </div>

</body>
</html>
