<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Mis Cursos Inscritos</title>
    <style>
        .card-curso {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card-curso:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12) !important;
        }
        .img-curso {
            height: 180px;
            object-fit: cover;
            border-radius: 8px 8px 0 0;
            background-color: #f8f9fa;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100 bg-light">
    <div th:replace="~{fragments/cabecera :: cabecera}"></div>

    <main class="flex-grow-1 py-5 container">
        <h1 class="fw-bold mb-4">Mis Cursos Inscritos</h1>

        <div th:if="${misCursos == null or #lists.isEmpty(misCursos)}" class="text-center py-5">
            <p class="text-muted">No tienes cursos inscritos actualmente.</p>
        </div>

        <div th:if="${misCursos != null and not #lists.isEmpty(misCursos)}" class="row g-4">
            <div class="col-md-4 col-lg-3" th:each="c : ${misCursos}">
                <div class="card shadow-sm border-0 h-100 card-curso">
                    <img th:src="${c.fotoCurso}" class="card-img-top img-curso" alt="Imagen del curso">
                    <div class="card-body">
                        <h5 class="fw-bold" th:text="${(c != null and c.titulo != null) ? c.titulo : 'Sin título'}">Título</h5>
                        <p class="text-muted small" th:text="${(c != null and c.categoria != null) ? c.categoria : 'Sin categoría'}">Categoría</p>
                        
                        <a th:if="${c != null and c.id != null}"
                           th:href="@{/detalleCurso/{id}(id=${c.id})}"
                           class="btn btn-outline-primary btn-sm w-100 mt-2">Ver detalles</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/pieDePagina :: pieDePagina}"></div>
</body>

</html>
