<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Formulario de Estudiante</title>
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <main class="flex-grow-1 py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="card shadow-sm border-0 p-4">
                        <div class="card-body">
                            <h2 class="mb-2 fw-bold text-primary">Registro de Estudiante</h2>
                            <p class="text-muted mb-4">Introduce los datos para dar de alta al nuevo alumno.</p>

                            <form method="post" th:action="@{/anadirestudiante/submit}" th:object="${estudianteFormulario}">

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-secondary fw-bold">DNI:</label>
                                        <input type="text" th:field="*{dni}" class="form-control shadow-sm" placeholder="12345678X" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-secondary fw-bold">Foto Perfil:</label>
                                        <input type="text" th:field="*{foto}" class="form-control shadow-sm" placeholder="http://imagen.jpg">
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-secondary fw-bold">Nombre:</label>
                                        <input type="text" th:field="*{username}" class="form-control shadow-sm" placeholder="Ej: Juan" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-secondary fw-bold">Apellidos:</label>
                                        <input type="text" th:field="*{apellidos}" class="form-control shadow-sm" placeholder="Ej: Pérez García" required>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-secondary fw-bold">Correo Electrónico:</label>
                                        <div class="input-group shadow-sm">
                                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                            <input type="email" th:field="*{email}" class="form-control" placeholder="ejemplo@correo.com" required>
                                        </div>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-secondary fw-bold">Contraseña:</label>
                                        <input type="password" th:field="*{password}" class="form-control shadow-sm" placeholder="••••••••" required>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-secondary fw-bold">Teléfono:</label>
                                        <input type="tel" th:field="*{telefono}" class="form-control shadow-sm" placeholder="Ej: 600123456" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-secondary fw-bold">Fecha Nacimiento:</label>
                                        <input type="date" th:field="*{fechaNacimiento}" class="form-control shadow-sm" required>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-4 mb-3">
                                        <label class="form-label text-secondary fw-bold">Nivel de Experiencia:</label>
                                        <select th:field="*{nivelExperiencia}" class="form-select shadow-sm" required>
                                            <option value="Principiante">Principiante</option>
                                            <option value="Intermedio">Intermedio</option>
                                            <option value="Avanzado">Avanzado</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <label class="form-label text-secondary fw-bold">Tipo de Rol:</label>
                                        <select th:field="*{rol}" class="form-select shadow-sm" required>
                                            <option value="USER">Estudiante</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <label class="form-label text-secondary fw-bold">País:</label>
                                        <input type="text" th:field="*{pais}" class="form-control shadow-sm" placeholder="Ej: España">
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-md-12">
                                        <label class="form-label text-secondary fw-bold">Localidad:</label>
                                        <input type="text" th:field="*{localidad}" class="form-control shadow-sm" placeholder="Ej: Madrid">
                                    </div>
                                </div>

                                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                    <a th:href="@{/admin/listaEstudiantes}" class="btn btn-outline-secondary px-4">Cancelar</a>
                                    <button type="submit" class="btn btn-success px-4 shadow-sm">
                                        <i class="bi bi-person-plus-fill"></i> Registrar Estudiante
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <div th:replace="~{fragments/pieDePagina :: pieDePagina}"></div>
    </body>
</html>
