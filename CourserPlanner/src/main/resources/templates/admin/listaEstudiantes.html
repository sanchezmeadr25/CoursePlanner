<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Lista de Estudiantes</title>
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <div th:replace="~{fragments/cabeceraAdmin :: cabeceraAdmin}"></div>

    <main class="container my-5 flex-grow-1">
        
        <div class="card shadow-sm border-0 p-4">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold text-primary">Lista de Estudiantes</h2>
                    <a th:href="@{/anadirestudiante}" class="btn btn-success shadow-sm px-4">
                        <i class="bi bi-plus-circle me-1"></i> Añadir Estudiante
                    </a>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th class="text-secondary">DNI</th>
                                <th class="text-secondary">Nombre de Usuario</th>
                                <th class="text-secondary">Apellidos</th>
                                <th class="text-secondary">Email</th>
                                <th class="text-secondary text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="estudiante : ${estudiantes}">
                                <td class="fw-bold" th:text="${estudiante.dni}">87654321B</td>
                                <td th:text="${estudiante.username}">user</td>
                                <td th:text="${estudiante.apellidos}">user</td>
                                <td th:text="${estudiante.email}">usser@user.com</td>

                                <td class="text-center">
                                    <div class="btn-group" role="group">
                                        
                                        <a th:href="@{/admin/editarEstudiante/{dni}(dni=${estudiante.dni})}"
                                            class="btn btn-outline-primary btn-sm">Editar</a>
                                        <button type="button" class="btn btn-outline-danger btn-sm" data-bs-toggle="modal"
                                            data-bs-target="#delete-modal" th:data-bs-id="${estudiante.dni}">Borrar</button>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(estudiantes)}">
                                <td colspan="5" class="text-center text-muted py-4">No hay estudiantes registrados.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="modal fade" id="delete-modal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold">Confirmar Borrado</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body py-4">
                        ¿Está seguro de que desea eliminar este estudiante? Esta acción no se puede deshacer.
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <a id="confirmDeleteBtn" href="#" class="btn btn-danger">Eliminar</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/pieDePagina :: pieDePagina}"></div>

    <script>
        const deleteModal = document.getElementById('delete-modal');
        if (deleteModal) {
            deleteModal.addEventListener('show.bs.modal', event => {
                const button = event.relatedTarget;
                const id = button.getAttribute('data-bs-id');
                const confirmBtn = deleteModal.querySelector('#confirmDeleteBtn');
                confirmBtn.href = '/admin/estudiante/borrar/' + id;
            });
        }
    </script>
</body>
</html>
