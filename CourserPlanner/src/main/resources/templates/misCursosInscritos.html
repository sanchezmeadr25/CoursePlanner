<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Mis Cursos Inscritos | CoursePlanner</title>
    <style>
        .card-curso {
            transition: all 0.3s ease;
            border: none;
        }
        .card-curso:hover {
            transform: translateY(-10px);
            box-shadow: 0 1rem 3rem rgba(0,0,0,0.175) !important;
        }
        .img-curso {
            height: 200px;
            object-fit: cover;
        }
        .bg-gradient-primary {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100 bg-light">
    
    <div th:replace="~{fragments/cabecera :: cabecera}"></div>

    <main class="flex-grow-1 py-5">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-5">
                <h1 class="fw-bold"><i class="bi bi-book-half text-primary"></i> Mis Cursos Inscritos</h1>
            </div>

            <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
            <div th:if="${error}" class="alert alert-warning" th:text="${error}"></div>

            <div th:if="${misCursos == null or #lists.isEmpty(misCursos)}" class="text-center py-5 bg-white rounded shadow-sm">
                <i class="bi bi-emoji-frown fs-1 text-muted"></i>
                <p class="text-muted mt-3">Todavía no te has inscrito en ningún curso.</p>
                <a th:href="@{/catalogo}" class="btn btn-primary mt-2">Explorar catálogo</a>
            </div>

            <div th:if="${misCursos != null and not #lists.isEmpty(misCursos)}" class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
                <div class="col" th:each="c : ${misCursos}">
                    <div class="card shadow-sm h-100 card-curso">
                        <img th:src="${c.fotoCurso != null and !#strings.isEmpty(c.fotoCurso) and (#strings.startsWith(c.fotoCurso, 'http') or #strings.startsWith(c.fotoCurso, '/')) ? c.fotoCurso : '/img/logo.png'}" 
                             class="card-img-top img-curso" alt="Imagen del curso">
                        
                        <div class="card-body d-flex flex-column">
                            <h5 class="fw-bold card-title" th:text="${c.titulo}">Título del curso</h5>
                            <span class="badge bg-light text-primary mb-2 align-self-start" th:text="${c.categoria}">Categoría</span>
                            
                            <p class="text-muted small flex-grow-1" th:text="${#strings.abbreviate(c.descripcion, 80)}">Descripción...</p>
                            
                            <div class="mt-3">
                                <a th:href="@{/cursoDetalle/{id}(id=${c.id})}" class="btn btn-outline-primary btn-sm fw-bold">Ver detalles</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/pieDePagina :: pieDePagina}"></div>

 
</body>
</html>
