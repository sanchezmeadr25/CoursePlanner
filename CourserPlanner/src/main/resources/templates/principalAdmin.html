<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Principal Instructor</title>
    <style>
        .card { border-radius: 12px; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .stat-card { background-color: #ffffff; }
    </style>
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/cabeceraAdmin :: cabeceraAdmin}"></div>

    <main class="container mt-4 py-5 flex-grow-1">
        <div class="mb-4">
            <h2 class="fw-bold text-primary">Bienvenido, <span th:text="${nombreUsuario}">Instructor</span></h2>
            <p class="text-muted">Panel de control del instructor</p>
        </div>

        <div class="row g-4">
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card stat-card shadow-sm border-0 p-3">
                    <div class="card-body text-center">
                        <h6 class="text-uppercase text-secondary small fw-bold">Cursos Activos</h6>
                        <h3 class="display-6 fw-bold text-primary" th:text="${numCursos}">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card stat-card shadow-sm border-0 p-3">
                    <div class="card-body text-center">
                        <h6 class="text-uppercase text-secondary small fw-bold">Total Estudiantes</h6>
                        <h3 class="display-6 fw-bold text-primary" th:text="${numEstudiantes}">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card stat-card shadow-sm border-0 p-3">
                    <div class="card-body text-center">
                        <h6 class="text-uppercase text-secondary small fw-bold">Calificacion</h6>
                        <h3 class="display-6 fw-bold text-primary" th:text="${#numbers.formatDecimal(calificacion, 1, 1)}">0.0</h3>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card stat-card shadow-sm border-0 p-3">
                    <div class="card-body text-center">
                        <h6 class="text-uppercase text-secondary small fw-bold">Valoraciones</h6>
                        <h3 class="display-6 fw-bold text-primary" th:text="${numValoraciones}">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-5 g-4">
            <div class="col-12 col-lg-6">
                <div class="card shadow-sm border-0 p-4">
                    <h5 class="fw-bold mb-3"><i class="bi bi-book"></i> Mis Cursos</h5>
                    <div th:if="${misCursos == null or #lists.isEmpty(misCursos)}">
                        <p class="text-center text-secondary py-5">No tienes cursos creados aun</p>
                    </div>
                    <div th:if="${misCursos != null and not #lists.isEmpty(misCursos)}" class="list-group list-group-flush">
                        <a th:each="curso : ${misCursos}"
                           th:href="@{/cursoDetalle/{id}(id=${curso.id})}"
                           class="list-group-item list-group-item-action d-flex justify-content-between align-items-start px-0">
                            <div class="me-3">
                                <h6 class="fw-bold mb-1" th:text="${curso.titulo}">Curso</h6>
                                <small class="text-muted" th:text="${curso.categoria}">Categoria</small>
                            </div>
                            <span class="badge bg-primary rounded-pill" th:text="${#lists.size(curso.listaInscripciones)}">0</span>
                        </a>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-6">
                <div class="card shadow-sm border-0 p-4">
                    <h5 class="fw-bold mb-3"><i class="bi bi-star"></i> Valoraciones Recientes</h5>
                    <div th:if="${valoracionesRecientes == null or #lists.isEmpty(valoracionesRecientes)}">
                        <p class="text-center text-secondary py-5">No hay valoraciones aun</p>
                    </div>
                    <div th:if="${valoracionesRecientes != null and not #lists.isEmpty(valoracionesRecientes)}" class="list-group list-group-flush">
                        <div th:each="valoracion : ${valoracionesRecientes}"
                             class="list-group-item px-0 d-flex justify-content-between align-items-start">
                            <div class="me-3">
                                <h6 class="fw-bold mb-1" th:text="${valoracion.curso.titulo}">Curso</h6>
                                <small class="text-muted" th:text="${valoracion.estudiante.username}">Estudiante</small>
                            </div>
                            <span class="badge bg-warning text-dark rounded-pill">
                                <i class="bi bi-star-fill"></i>
                                <span th:text="${#numbers.formatDecimal(valoracion.valoracion, 1, 1)}">0.0</span>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/pieDePagina :: pieDePagina}"></div>

</body>
</html>
