<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoursePlanner - Impulsa tu Carrera Profesional</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .hero-section {
            background: linear-gradient(135deg, #78c2ad, #5a9e8a);
        }

        .category-card:hover {
            transform: translateY(-5px);
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1) !important;
        }

        .course-card img {
            height: 180px;
            object-fit: cover;
        }
    </style>
</head>
<body class="bg-light">
    <div th:replace="fragments/cabecera :: cabecera"></div>
    <main class="container-fluid px-4 py-5" style="min-height: 80vh;">
        <div class="mb-4">
            <h2 class="fw-bold">Bienvenido, <span th:text="${usuario.username}">Adrián</span></h2>
            <p class="text-secondary">Tu panel de aprendizaje</p>
        </div>

        <div class="row g-4">
            <div class="col-12 col-md-4">
                <div class="card bg-dark text-white border border-secondary p-3">
                    <h6 class="text-uppercase text-secondary small">Cursos Inscritos</h6>
                    <h3 class="fw-bold" th:text="${numInscritos}">0</h3>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card bg-dark text-white border border-secondary p-3">
                    <h6 class="text-uppercase text-secondary small">Cursos Disponibles</h6>
                    <h3 class="fw-bold" th:text="${numDisponibles}">0</h3>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card bg-dark text-white border border-secondary p-3">
                    <h6 class="text-uppercase text-secondary small">Valoraciones Dadas</h6>
                    <h3 class="fw-bold" th:text="${numValoraciones}">0</h3>
                </div>
            </div>
        </div>

        <div class="row mt-5 g-4">
            <div class="col-12 col-lg-6">
                <div class="card bg-dark text-white border border-secondary p-4 h-100">
                    <h5 class="fw-bold mb-3">Mis Cursos</h5>


                    <div th:unless="${#lists.isEmpty(misCursos)}" th:each="inscripcion : ${misCursos}">
                        <div class="border-bottom border-secondary py-2">
                            <h6 class="mb-1" th:text="${inscripcion.curso.titulo}">Nombre del Curso</h6>
                        </div>
                    </div>
                    <div th:if="${#lists.isEmpty(misCursos)}">
                        <p class="text-center text-secondary py-5">No estás inscrito en ningún curso aún</p>
                        <a href="/catalogo" class="btn btn-primary w-100">Explorar Cursos</a>
                    </div>

                </div>
            </div>

            <div class="col-12 col-lg-6">
                <div class="card bg-dark text-white border border-secondary p-4">
                    <h5 class="fw-bold mb-3">Cursos Recomendados</h5>

                    <div th:each="curso : ${cursosRecomendados}" class="border-bottom border-secondary py-3">
                        <h6 class="mb-1" th:text="${curso.titulo}">Título del Curso</h6>
                        <small class="text-secondary" th:text="'Instructor: ' + ${curso.instructor.nombre}">Nombre
                            Instructor</small>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="~{fragments/general :: pieDePagina}"></div>
</body>

</html>
