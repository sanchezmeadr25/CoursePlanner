<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Editar Perfil</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body class="bg-light">

    <main class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-4">Editar Perfil de Instructor</h2>

                        <form th:action="@{/editarInstructor/submit}" th:object="${instructorFormulario}" method="post">

                            <input type="hidden" th:field="*{dni}" />

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Nombre:</label>
                                    <input type="text" th:field="*{username}" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Apellidos:</label>
                                    <input type="text" th:field="*{apellidos}" class="form-control" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Correo Electrónico:</label>
                                <input type="email" th:field="*{email}" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">URL Foto de Perfil:</label>
                                <input type="text" th:field="*{foto}" class="form-control">
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Teléfono:</label>
                                    <input type="text" th:field="*{telefono}" class="form-control">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Especialidad:</label>
                                    <input type="text" th:field="*{especialidad}" class="form-control">
                                </div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                                <a th:href="@{/principalAdmin}" class="btn btn-outline-secondary">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
