<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Formulario de Curso</title>
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <div th:replace="~{fragments/cabeceraAdmin :: cabeceraAdmin}"></div>

    <main class="flex-grow-1 py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="card shadow-sm border-0 p-4">
                        <div class="card-body">
                            <h2 class="mb-2" th:text="${curso.id == null} ? 'Crear Nuevo Curso' : 'Editar Curso'">
                                Formulario</h2>
                            <p class="text-muted mb-4">Introduce los datos para gestionar el curso en la plataforma.</p>

                            <form method="post"
                                th:action="${curso.id == null} ? @{/crearCurso/submit} : @{/admin/editarCurso/submit}"
                                th:object="${curso}">

                                <input type="hidden" th:if="${curso.id != null}" th:field="*{id}" />

                                <div class="row">
                                    <div class="col-md-8 mb-3">
                                        <label class="form-label text-secondary fw-bold">Título del Curso:</label>
                                        <input type="text" th:field="*{titulo}" class="form-control" required>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <label class="form-label text-secondary fw-bold">Categoría:</label>
                                        <input type="text" th:field="*{categoria}" class="form-control" required>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-secondary fw-bold">Horas:</label>
                                        <input type="number" th:field="*{horasForm}" class="form-control" min="0">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-secondary fw-bold">Minutos:</label>
                                        <input type="number" th:field="*{minutosForm}" class="form-control" min="0"
                                            max="59">
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label text-secondary fw-bold">Precio (€):</label>
                                            <input type="number" step="0.01" th:field="*{precio}" class="form-control"
                                                required>
                                        </div>

                                        <div class="col-md-6 mb-3">
                                            <label class="form-label text-secondary fw-bold">Descuento (%):</label>
                                            <input type="number" step="0.1" th:field="*{descuento}" class="form-control"
                                                min="0" max="100" placeholder="Ej: 20.0">
                                        </div>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-secondary fw-bold">Plazas Máximas:</label>
                                        <input type="number" th:field="*{plazasMaximas}" class="form-control">
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label text-secondary fw-bold">URL de la imagen del curso:</label>
                                    <input type="text" th:field="*{fotoCurso}" class="form-control">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label text-secondary fw-bold">Descripción:</label>
                                    <textarea th:field="*{descripcion}" class="form-control" rows="4"></textarea>
                                </div>

                                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                    <a th:href="@{/admin/misCursos}" class="btn btn-outline-secondary px-4">Cancelar</a>
                                    <button type="submit" class="btn btn-success px-4">
                                        <i class="bi bi-check-lg"></i> Guardar Cambios
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/pieDePagina :: pieDePagina}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
