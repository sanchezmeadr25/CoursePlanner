<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Curso</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body class="bg-light">

    <div th:replace="~{(${#authorization.expression('hasRole(''ADMIN'')')} ? 'fragments/cabeceraAdmin' : 'fragments/cabecera') :: (${#authorization.expression('hasRole(''ADMIN'')')} ? 'cabeceraAdmin' : 'cabecera')}"></div>

    <main class="container py-5">
        <div class="row">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 p-4 mb-4">
                    <img th:if="${curso.fotoCurso}" th:src="${curso.fotoCurso}" class="img-fluid rounded mb-3" alt="Imagen curso">
                    <h1 class="fw-bold" th:text="${curso.titulo}">Título</h1>
                    <span class="badge bg-primary mb-3" th:text="${curso.categoria}">Categoría</span>
                    <h4 class="mt-3">Descripción</h4>
                    <p class="text-muted" th:text="${curso.descripcion}">Descripción...</p>
                </div>

                <div class="card shadow-sm border-0 p-4 mt-3" th:if="${curso.listaInscripciones != null and not #lists.isEmpty(curso.listaInscripciones)}">
                    <h4 class="fw-bold mb-3">Estudiantes Inscritos</h4>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Estudiante</th>
                                <th>Progreso</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="inscripcion : ${curso.listaInscripciones}">
                                <td th:text="${inscripcion.estudiante.username}">Usuario</td>
                                <td th:text="${inscripcion.progreso + '%'}">0%</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card shadow-sm border-0 p-4">
                    <h5 class="fw-bold mb-3">Ficha Técnica</h5>
                    <ul class="list-unstyled">
                        <li class="mb-2"><i class="bi bi-person"></i> <strong>Instructor:</strong>
                            <span th:text="${curso.instructor != null ? curso.instructor.username : 'Sin asignar'}"></span>
                        </li>
                        <li class="mb-2"><i class="bi bi-clock"></i> <strong>Duración:</strong>
                            <span th:text="${curso.duracionHoras != null ? curso.duracionFormateada : 'No definida'}"></span>
                        </li>
                        <li class="mb-2"><i class="bi bi-cash"></i> <strong>Precio:</strong>
                            <span th:text="${curso.precio + ' €'}"></span>
                        </li>
                        <li class="mb-2"><i class="bi bi-people"></i> <strong>Plazas Máximas:</strong>
                            <span th:text="${curso.plazasMaximas}"></span>
                        </li>
                    </ul>
                    <a th:href="@{/admin/misCursos}" class="btn btn-outline-secondary w-100 mt-3">Volver al listado</a>
                    <a th:href="@{/inscripcion/nueva(cursoId=${c.id})}" class="btn btn-success btn-sm">
                                    <i class="bi bi-person-plus-fill"></i>  <li class="mb-2"><i class="bi bi-cash"></i> <strong>Precio:</strong>
                            <span th:text="${curso.precio + ' €'}">Inscribirse</span>
                        </li>
                                </a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
