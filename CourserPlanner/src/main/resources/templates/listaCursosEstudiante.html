<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Catálogo Global de Cursos</title>
    <style>
        .card-curso {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card-curso:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12) !important;
        }

        .img-curso {
            height: 180px;
            object-fit: cover;
            border-radius: 8px 8px 0 0;
        }
    </style>
    </head>

    <body class="d-flex flex-column min-vh-100 ">

        <div th:replace="~{fragments/cabecera :: cabecera}"></div>

        <main class="flex-grow-1 py-5">
            <div class="container">
                <div class="row mb-5 align-items-center">
                    <div class="col-md-8 text-center text-md-start">
                        <h1 class="fw-bold text-dark display-6 mb-2">Catálogo de
                            Cursos</h1>
                    </div>
                    <div class="col-md-4 text-center text-md-end">
                        <span
                            class="badge bg-primary fs-6 px-3 py-2 shadow-sm rounded-pill">
                            <span th:text="${#lists.size(cursos)} + ' Cursos'">0
                                Cursos</span>
                        </span>
                    </div>
                </div>

            <div th:if="${not #lists.isEmpty(cursos)}" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
                <div class="col" th:each="c : ${cursos}">
                    <div class="card h-100 shadow-sm border-0 card-curso">
                        <img th:src="${c.fotoCurso}" class="card-img-top img-curso" alt="Imagen del curso">

                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title fw-bold" th:text="${c.titulo}">Nombre</h5>
                            <p class="text-muted flex-grow-1" th:text="${c.categoria}">Categoría</p>

                            <div class="mt-3 d-grid gap-2">
                                <a th:href="@{/cursoDetalle/{id} (id=${c.id})}"
                                    class="btn btn-outline-primary btn-sm fw-bold">Ver detalles</a>

                                <a th:href="@{/inscripcion/nueva(cursoId=${c.id})}" class="btn btn-success btn-sm">
                                    <i class="bi bi-person-plus-fill"></i> Inscribirse
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

    <div th:replace="~{fragments/pieDePagina :: pieDePagina}"></div>
</body>

</html>
