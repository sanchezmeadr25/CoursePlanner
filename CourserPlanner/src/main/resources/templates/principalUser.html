<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CoursePlanner - Impulsa tu Carrera Profesional</title>
        <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet">

    </head>
    <body class=" bg-dark text-white">
        <div th:replace="fragments/cabecera :: cabecera"></div>

        <main class="container-fluid px-4 py-5" style="min-height: 80vh;">
            <div class="mb-4">
                <h2 class=" text-primary fw-bold">Bienvenido, <span
                        th:text="${usuario.username}">Estudiante</span></h2>
                <p>Tu panel de aprendizaje</p>
            </div>

            <div class="row g-4">
                <div class="col-12 col-md-4">
                    <div
                        class="card bg-dark text-primary border border-primary p-3">
                        <h6 class="text-uppercase text-primary small">Cursos
                            Inscritos</h6>
                        <h3 th:text="${numInscritos}">0</h3>
                    </div>
                </div>
                <div class="col-12 col-md-4">
                    <div
                        class="card bg-dark text-primary border border-primary p-3">
                        <h6 class="text-uppercase text-primary small">Cursos
                            Disponibles</h6>
                        <h3 th:text="${numDisponibles}">0</h3>
                    </div>
                </div>
                <div class="col-12 col-md-4">
                    <div
                        class="card bg-dark text-primary border border-primary p-3">
                        <h6
                            class="text-uppercase text-primary small">Valoraciones
                            Dadas</h6>
                        <h3
                            th:text="${numValoraciones}">0</h3>
                    </div>
                </div>
            </div>

            <div class="row mt-5 g-4">
                <div class="text-primary col-12 col-lg-6">
                    <div
                        class="card bg-dark text-primary border border-primary p-4 h-100">
                        <h5 class=" text-primary fw-bold mb-3">Mis Cursos</h5>

                        <div th:unless="${#lists.isEmpty(misCursos)}"
                            th:each="inscripcion : ${misCursos}">
                            <div class="border-bottom border-primary py-2">
                                <h6 class="mb-1"
                                    th:text="${inscripcion.curso.titulo}">Nombre
                                    del Curso</h6>
                            </div>
                        </div>
                        <div th:if="${#lists.isEmpty(misCursos)}">
                            <p class="text-center  py-5">No estás
                                inscrito en ningún curso aún</p>
                            <a href="/catalogo"
                                class="btn btn-primary w-100">Explorar
                                Cursos</a>
                        </div>

                    </div>
                </div>

                <div class="text-white col-12 col-lg-6">
                    <div
                        class="card bg-dark border border-primary p-4">
                        <h5 class=" text-primary fw-bold mb-3">Cursos
                            Recomendados</h5>

                        <div th:each="curso : ${cursosRecomendados}"
                            class="border-bottom border-primary py-3">
                            <h6 class=" mb-1"
                                th:text="${curso.titulo}">Título
                                del Curso</h6>
                            <small class
                                th:text="'Instructor: ' + ${curso.instructor.nombre}">Nombre
                                Instructor</small>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <div th:replace="~{fragments/pieDePagina :: pieDePagina}"></div>
    </body>

</html>
