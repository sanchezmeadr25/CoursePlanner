<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">

        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <title>Formulario de Estudiante</title>
    </head>

    <body class="d-flex flex-column min-vh-100">
        <div th:replace="~{fragments/cabecera :: cabecera}"></div>

        <main class="flex-grow-1 mt-4">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-8 form-container">
                        <div class="card shadow-lg border-0 bg-dark"
                            data-bs-theme="dark">
                            <div class="card-body p-4">
                                <h2
                                    class="text-center mb-4 text-primary">Registro
                                    de Estudiante</h2>
                                <p class="text-muted text-center">Introduce los
                                    datos para dar de alta al nuevo alumno.</p>

                                <form method="post"
                                    th:action="@{/anadirestudiante/submit}"
                                    th:object="${estudianteFormulario}">

                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label
                                                class="form-label font-weight-bold">DNI:</label>
                                            <input type="text" th:field="*{dni}"
                                                class="form-control"
                                                placeholder="12345678X"
                                                required>
                                        </div>

                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Foto
                                                Perfil:</label>
                                            <input type="text"
                                                th:field="*{fotoPerfil}"
                                                class="form-control"
                                                placeholder="http://imagen.jpg">
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label
                                                class="form-label">Nombre:</label>
                                            <input type="text"
                                                th:field="*{username}"
                                                class="form-control"
                                                placeholder="Ej:Juan" required>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label
                                                class="form-label">Apellidos:</label>
                                            <input type="text"
                                                th:field="*{apellidos}"
                                                class="form-control"
                                                placeholder="Ej:Pérez García"
                                                required>
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Correo
                                                Electrónico:</label>
                                            <div class="input-group">
                                                <span
                                                    class="input-group-text">@</span>
                                                <input type="email"
                                                    th:field="*{email}"
                                                    class="form-control"
                                                    placeholder="Ej:ejemplo@correo.com"
                                                    required>
                                            </div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label
                                                class="form-label">Contraseña:</label>
                                            <input type="password"
                                                th:field="*{password}"
                                                class="form-control"
                                                placeholder="Introduce una contraseña segura"
                                                required>

                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label
                                                class="form-label">Teléfono:</label>
                                            <input type="tel"
                                                th:field="*{telefono}"
                                                class="form-control"
                                                placeholder="Ej:600123456"
                                                required>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Fecha
                                                Nacimiento:</label>
                                            <input type="date"
                                                th:field="*{fechaNacimiento}"
                                                class="form-control" required>
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Nivel de
                                                Experiencia:</label>
                                            <select
                                                th:field="*{nivelExperiencia}"
                                                class="form-select" required>
                                                <option
                                                    value="Principiante">Principiante</option>
                                                <option
                                                    value="Intermedio">Intermedio</option>
                                                <option
                                                    value="Avanzado">Avanzado</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Tipo de
                                                Rol</label>
                                            <select
                                                th:field="*{rol}"
                                                class="form-select" required>
                                                <option
                                                    value="USER">Estudiante</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label
                                                class="form-label">País:</label>
                                            <input type="text"
                                                th:field="*{pais}"
                                                class="form-control"
                                                placeholder="Ej:España">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label
                                                class="form-label">Localidad:</label>
                                            <input type="text"
                                                th:field="*{localidad}"
                                                class="form-control"
                                                placeholder="Ej:Madrid">
                                        </div>
                                    </div>

                                    <div class="d-grid gap-2 mt-4">
                                        <button type="submit"
                                            name="enviar"
                                            value="enviar"
                                            class="btn btn-primary btn-lg">
                                            <i
                                                class="bi bi-person-plus-fill"></i>
                                            Registrar Estudiante
                                        </button>
                                        <a href="/"
                                            class="btn btn-outline-secondary">Cancelar</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <div th:replace="~{fragments/pieDePagina :: piedepagina}"></div>

    </body>

</html>
