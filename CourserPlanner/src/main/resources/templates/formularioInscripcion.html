<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <title>Nueva Inscripción</title>
    </head>

    <body class="d-flex flex-column min-vh-100 ">

        <div th:replace="~{fragments/cabecera :: cabecera}"></div>

        <main class="flex-grow-1 py-5">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-8">
                        <div class="card shadow-sm border-0 p-4">
                            <div class="card-body">
                                <h2 class="mb-2">Registrar Inscripción</h2>
                                <p class="text-muted mb-4">Confirma tu
                                    inscripción al curso seleccionado.</p>

                                <div th:if="${error}" class="alert alert-danger"
                                    role="alert">
                                    <i
                                        class="bi bi-exclamation-triangle-fill"></i>
                                    <span th:text="${error}"></span>
                                </div>

                                <form method="post"
                                    th:action="@{/inscripcion/nuevainscripcion/submit}"
                                    th:object="${inscripcion}">

                                    <input type="hidden"
                                        th:field="*{inscripcionPK.cursoId}">

                                    <div class="row">
                                        <div class="col-md-12 mb-3">
                                            <label
                                                class="form-label text-secondary fw-bold">Detalles
                                                de la inscripción</label>
                                            <p class="text-info">
                                                <i
                                                    class="bi bi-info-circle"></i>
                                                Tu DNI y el progreso inicial
                                                (0%) se asignarán
                                                automáticamente al confirmar.
                                            </p>
                                        </div>
                                    </div>

                                    <div
                                        class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                        <a th:href="@{/catalogo}"
                                            class="btn btn-outline-secondary px-4">Cancelar</a>
                                        <button type="submit"
                                            class="btn btn-success px-4">
                                            <i
                                                class="bi bi-check-circle-fill"></i>
                                            Confirmar Inscripción
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <div th:replace="~{fragments/pieDePagina :: pieDePagina}"></div>

    </body>
</html>
