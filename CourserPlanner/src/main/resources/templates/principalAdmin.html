<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Principal Instructor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <style>
        .card {
            border-radius: 12px;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .stat-card {
            background-color: #f8f9fa;
        }
    </style>
</head>

<body>

    <div th:replace="~{fragments/cabeceraAdmin :: cabeceraAdmin}"></div>

    <main class="container-fluid mt-4 px-4 bg-light py-5">
        <div class="mb-4">
            <h2 class="fw-bold">Bienvenido, <span th:text="${nombreUsuario}">Instructor</span></h2>
            <p class="text-muted">Panel de control del instructor</p>
        </div>

        <div class="row g-4">
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card stat-card shadow-sm border border-1 p-3 bg-white">
                    <div class="card-body">
                        <h6 class="text-uppercase text-secondary small fw-bold">Cursos Activos</h6>
                        <h3 class="display-6 fw-bold text-primary" th:text="${numCursos}">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card stat-card shadow-sm border border-1 p-3 bg-white">
                    <div class="card-body">
                        <h6 class="text-uppercase text-secondary small fw-bold">Total Estudiantes</h6>
                        <h3 class="display-6 fw-bold text-primary" th:text="${numEstudiantes}">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card stat-card shadow-sm border border-1 p-3 bg-white">
                    <div class="card-body">
                        <h6 class="text-uppercase text-secondary small fw-bold">Calificación Promedio</h6>
                        <h3 class="display-6 fw-bold text-primary" th:text="${calificacion}">0.0</h3>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card stat-card shadow-sm border border-1 p-3 bg-white">
                    <div class="card-body">
                        <h6 class="text-uppercase text-secondary small fw-bold">Total Valoraciones</h6>
                        <h3 class="display-6 fw-bold text-primary" th:text="${numValoraciones}">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-5 g-4">
            <div class="col-12 col-lg-6">
                <div class="card shadow-sm border border-1 p-4 bg-white">
                    <h5 class="fw-bold mb-3">Mis Cursos</h5>
                    <p class="text-center text-secondary py-5">No tienes cursos creados aún</p>
                </div>
            </div>
            <div class="col-12 col-lg-6">
                <div class="card shadow-sm border border-1 p-4 bg-white">
                    <h5 class="fw-bold mb-3">Valoraciones Recientes</h5>
                    <p class="text-center text-secondary py-5">No hay valoraciones aún</p>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="~{fragments/pieDePagina :: pieDePagina}"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
