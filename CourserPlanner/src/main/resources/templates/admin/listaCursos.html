<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Lista Cursos</title>
</head>

<body class="d-flex flex-column min-vh-100 ">

    <div th:replace="~{fragments/cabeceraAdmin :: cabeceraAdmin}"></div>

    <main class="flex-grow-1 py-5">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold">Mis Cursos</h2>
                    <p class="text-muted">Gestiona tus cursos</p>
                </div>
                <a th:href="@{/crearCurso}" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Crear Curso
                </a>
            </div>

            <div th:unless="${#lists.size(listaCurso) > 0}" class="card shadow-sm border-0 p-5 text-center">
                <div class="card-body">
                    <p class="text-muted mb-3">No tienes cursos creados aún</p>
                    <a th:href="@{/crearCurso}" class="text-decoration-none fw-bold">Crear tu primer curso</a>
                </div>
            </div>

            <div th:if="${not #lists.isEmpty(listaCurso)}" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
                <div class="col" th:each="curso : ${listaCurso}">
                    <div class="card h-100 shadow-sm border-0 p-3">
                        <div class="card-body">
                            <h5 class="card-title fw-bold" th:text="${curso.titulo}">Nombre del Curso</h5>
                            <p class="text-muted" th:text="${curso.categoria}">Categoría</p>

                            <hr>

                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <i class="bi bi-people"></i>
                                    <span th:text="${#lists.size(curso.listaInscripciones) + ' estudiantes'}">0
                                        estudiantes</span>
                                </div>
                                <a href="#" class="text-decoration-none fw-bold">Ver estudiantes</a>

                                <div class="d-flex">
                                    <a th:href="@{/admin/editarCurso/{id}(id=${curso.id})}"
                                        class="btn btn-outline-primary btn-sm ms-2 fw-bold">Editar</a>

                                    <button type="button" class="btn btn-outline-danger btn-sm ms-2 fw-bold"
                                        data-bs-toggle="modal" data-bs-target="#delete-modal"
                                        th:data-bs-id="${curso.id}">Borrar</button>
                                </div>
                            </div>

                            <p class="text-muted small mt-3 mb-0">
                                Estado: <span class="badge bg-success">Activo</span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="delete-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirmar Borrado</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    ¿Está seguro de que desea eliminar este curso? Esta acción no se puede deshacer.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <a id="confirmDeleteBtn" href="#" class="btn btn-danger">Eliminar</a>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/pieDePagina :: pieDePagina}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const deleteModal = document.getElementById('delete-modal');
        if (deleteModal) {
            deleteModal.addEventListener('show.bs.modal', event => {
                const button = event.relatedTarget;
                const id = button.getAttribute('data-bs-id');
                const confirmBtn = deleteModal.querySelector('#confirmDeleteBtn');
                // La ruta debe coincidir con el @GetMapping en tu Controlador
                confirmBtn.href = '/admin/borrarCurso/' + id;
            });
        }
    </script>
</body>

</html>
