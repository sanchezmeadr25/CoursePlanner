<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>CoursePlanner - Impulsa tu Carrera Profesional</title>
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <div th:replace="~{fragments/cabecera :: cabecera}"></div>

    <main class="container py-5 flex-grow-1">
        <div class="mb-4">
            <h2 class="fw-bold text-primary">Bienvenido, <span th:text="${usuario?.username ?: 'Estudiante'}">Estudiante</span></h2>
            <p class="text-muted">Tu panel de aprendizaje</p>
        </div>

        <div class="row g-4">
            <div class="col-12 col-md-4">
                <div class="card shadow-sm border-0 p-3 h-100">
                    <div class="card-body">
                        <h6 class="text-uppercase text-secondary small fw-bold">Cursos Inscritos</h6>
                        <h3 class="fw-bold text-primary" th:text="${numInscritos}">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card shadow-sm border-0 p-3 h-100">
                    <div class="card-body">
                        <h6 class="text-uppercase text-secondary small fw-bold">Cursos Disponibles</h6>
                        <h3 class="fw-bold text-primary" th:text="${numDisponibles}">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card shadow-sm border-0 p-3 h-100">
                    <div class="card-body">
                        <h6 class="text-uppercase text-secondary small fw-bold">Valoraciones Dadas</h6>
                        <h3 class="fw-bold text-primary" th:text="${numValoraciones}">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-5 g-4">
            <div class="col-12 col-lg-6">
                <div class="card shadow-sm border-0 p-4 h-100">
                    <h5 class="fw-bold mb-3 text-primary"><i class="bi bi-book"></i> Mis Cursos</h5>

                    <div th:unless="${#lists.isEmpty(misCursos)}">
                        <div th:each="inscripcion : ${misCursos}" class="border-bottom py-2">
                            <h6 class="mb-1" th:text="${inscripcion.curso != null ? inscripcion.curso.titulo : 'Curso sin título'}">Nombre del Curso</h6>
                        </div>
                    </div>
                    <div th:if="${#lists.isEmpty(misCursos)}">
                        <p class="text-center text-muted py-5">No estás inscrito en ningún curso aún</p>
                        <a th:href="@{/catalogo}" class="btn btn-primary w-100">Explorar Cursos</a>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-6">
                <div class="card shadow-sm border-0 p-4 h-100">
                    <h5 class="fw-bold mb-3 text-primary"><i class="bi bi-star"></i> Cursos Recomendados</h5>

                    <div th:each="curso : ${cursosRecomendados}" class="border-bottom py-3">
                        <h6 class="mb-1" th:text="${curso?.titulo ?: 'Título no disponible'}">Título del Curso</h6>
                        <small class="text-muted" th:text="${curso.instructor != null ? 'Instructor: ' + curso.instructor.username : 'Instructor no asignado'}">Nombre Instructor</small>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/pieDePagina :: pieDePagina}"></div>

</body>
</html>
