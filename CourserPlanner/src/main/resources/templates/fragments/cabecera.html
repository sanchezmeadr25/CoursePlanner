<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Planner</title>

    <link href="../Documents/bootstrap.min (1).css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <header th:fragment="cabecera">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm py-3">
            <div class="container-fluid px-4">
                <a class="navbar-brand d-flex align-items-center fw-bold fs-3" href="#">
                    <img th:src="@{/img/logo.png}" alt="Logo" width="45" height="35" class="me-2">
                    <span class="text-primary">Course</span>Planner
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav mx-auto">
                        <li class="nav-item"><a class="nav-link active" href="/dashboard">Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="/catalogo">Catálogo</a></li>
                        <li class="nav-item"><a class="nav-link" href="/mis-cursos">Mis Cursos</a></li>
                    </ul>
                    <div class="d-flex align-items-center">
                        <div class="dropdown">
                            <a href="#"
                                class="d-flex align-items-center text-white text-decoration-none dropdown-toggle"
                                id="userMenu" data-bs-toggle="dropdown">
                                <img th:src="${usuario.fotoPerfil}" width="40" height="40"
                                    class="rounded-circle border border-2 border-light">
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end shadow mt-2">
                                <li>
                                    <h6 class="dropdown-header" th:text="${usuario.username}">Adrián</h6>
                                </li>
                                <li><a class="dropdown-item" href="/perfil">Editar perfil</a></li>
                                <li>
                                    <form th:action="@{/logout}" method="post">
                                        <button type="submit" class="dropdown-item text-danger">Cerrar sesión</button>
                                    </form>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
