<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Course Planner</title>

        <link href="../Documents/bootstrap.min (1).css" rel="stylesheet">

        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>

    <body>

        <header th:fragment="cabecera">
            <nav
                class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm py-4">
                <div class="container">

                    <a
                        class="navbar-brand d-flex align-items-center fw-bold fs-3"
                        href="#">
                        <img src="logo, proyecto.png" alt="Logo" width="45"
                            height="35" class="me-2">
                        <span class="text-primary">Course</span>Planner
                    </a>

                    <div class="collapse navbar-collapse" id="navbarNav">

                        <ul class="navbar-nav mx-auto mb-2 mb-lg-0 fs-5">
                            <li class="nav-item"><a class="nav-link active"
                                    href="#">Inicio</a></li>
                            <li class="nav-item"><a class="nav-link"
                                    href="#">Características</a></li>
                            <li class="nav-item"><a class="nav-link"
                                    href="#">Servicios</a></li>
                        </ul>

                        <div class="dropdown">
                            <a href="#"
                                class="d-flex align-items-center text-white text-decoration-none dropdown-toggle"
                                data-bs-toggle="dropdown">
                                <img src="https://github.com/mdo.png" alt="mdo"
                                    width="45" height="45"
                                    class="rounded-circle">
                            </a>

                            <ul
                                class="dropdown-menu dropdown-menu-end shadow fs-5">
                                <li><a class="dropdown-item"
                                        href="#">Perfil</a></li>
                                <li>
                                    <hr class="dropdown-divider">
                                </li>
                                <li><a class="dropdown-item text-danger"
                                        href="#">Cerrar sesión</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </nav>
        </header>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    </body>

</html>
