<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <title>Catálogo Global de Cursos</title>
        <style>
    
            .card-curso {
                transition: transform 0.2s ease, box-shadow 0.2s ease;
            }
            .card-curso:hover {
                transform: translateY(-5px);
                box-shadow: 0 10px 20px rgba(0,0,0,0.12) !important;
            }
        </style>
    </head>
    <body class="d-flex flex-column min-vh-100 bg-light">

        <div th:replace="~{fragments/cabecera :: cabecera}"></div>

        <main class="flex-grow-1 py-5">
            <div class="container">

                <div class="row mb-5 align-items-center">
                    <div class="col-md-8 text-center text-md-start">
                        <h1 class="fw-bold text-dark display-6 mb-2">Catálogo
                            de Cursos</h1>
                        <p class="text-muted lead">Explora todos los cursos
                            disponibles en la plataforma, impartidos por todos
                            nuestros instructores.</p>
                    </div>
                    <div class="col-md-4 text-center text-md-end mt-3 mt-md-0">
                        <span
                            class="badge bg-primary fs-6 px-3 py-2 shadow-sm rounded-pill">
                            <i class="bi bi-collection-play-fill me-2"></i>
                            <span
                                th:text="${#lists.size(curso)} + ' Cursos en total'">0
                                Cursos en total</span>
                        </span>
                    </div>
                </div>
                <div th:="${not #lists.isEmpty(curso)}"
                    class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
                    <div class="col" th:each="curso : ${listaCurso}">
                        <div class="card h-100 shadow-sm border-0 p-3">
                            <div class="card-body">
                                <h5 class="card-title fw-bold"
                                    th:text="${curso.titulo}">Nombre del
                                    Curso</h5>
                                <p class="text-muted"
                                    th:text="${curso.categoria}">Categoría</p>
                                <div
                                    class="card-footer bg-transparent border-0 d-flex justify-content-between align-items-center">
                                    <a
                                        th:href="@{/detalleCurso/{id}(id=${curso.id})}"
                                        class="btn btn-outline-primary btn-sm">Ver
                                        Detalles</a>

                                </div>
                            </div>
                        </div>
                    </div>
                </body>
            </html>
