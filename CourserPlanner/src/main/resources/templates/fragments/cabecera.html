<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Planner</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <header th:fragment="cabecera">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm py-3">
            <div class="container-fluid px-4">
                <a class="navbar-brand d-flex align-items-center fw-bold fs-3" th:href="@{/principalUser}">
                    <img th:src="@{/img/logo.png}" alt="Logo" width="45" height="35" class="me-2">
                    <span class="text-primary">Course</span>Planner
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarUser"
                    aria-controls="navbarUser" aria-expanded="false" aria-label="Mostrar menu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarUser">
                    <ul class="navbar-nav mx-auto">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/principalUser}">Principal</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/catalogo}">Catalogo</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/misCursosInscritos}">Mis Cursos</a>
                        </li>
                    </ul>

                    <div class="d-flex align-items-center" th:if="${usuario != null}">
                        <div class="dropdown">
                            <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle"
                                id="userMenu" data-bs-toggle="dropdown" aria-expanded="false">
                                <img th:src="${usuario.foto != null and !#strings.isEmpty(usuario.foto) and (#strings.startsWith(usuario.foto, 'http') or #strings.startsWith(usuario.foto, '/')) ? usuario.foto : 'https://ssl.gstatic.com/accounts/ui/avatar_2x.png'}"
                                    width="40" height="40"
                                    class="rounded-circle border border-2 border-light object-fit-cover"
                                    alt="Foto de perfil"
                                    onerror="this.onerror=null;this.src='https://ssl.gstatic.com/accounts/ui/avatar_2x.png';">
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end shadow mt-2" aria-labelledby="userMenu">
                                <li>
                                    <h6 class="dropdown-header" th:text="${usuario.username}">Usuario</h6>
                                </li>
                                <li>
                                    <a class="dropdown-item" th:href="@{/principalUser}">
                                        <i class="bi bi-person-circle me-2"></i>Ver perfil
                                    </a>
                                </li>
                                <li>
                                    <a class="dropdown-item" th:href="@{/misCursosInscritos}">
                                        <i class="bi bi-book-half me-2"></i>Mis cursos
                                    </a>
                                </li>
                                <li>
                                    <form th:action="@{/logout}" method="post">
                                        <button type="submit" class="dropdown-item text-danger">
                                            <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesion
                                        </button>
                                    </form>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>
</body>

</html>
