<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../Documents/bootstrap.min (1).css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <title>Cabecera Admin</title>
</head>

<body>

    <header th:fragment="cabeceraAdmin">
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3 mb-4">
            <div class="container-fluid px-4">

                <a class="navbar-brand d-flex align-items-center fw-bold fs-3" th:href="@{/principalAdmin}">
                    <img th:src="@{/img/logo.png}" alt="Logo" width="45" height="35" class="me-2">
                    <span class="text-primary">Course</span>Planner
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav mx-auto">
                        <li class="nav-item">
                            <a class="nav-link active fw-semibold" th:href="@{/principalAdmin}">Principal</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/misCursos}">Mis Cursos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/listaEstudiantes}">Estudiantes</a>
                        </li>
                    </ul>

                    <div class="d-flex align-items-center">
                        <div class="dropdown">
                            <a href="#" class="d-flex align-items-center link-dark text-decoration-none"
                                id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
                                <img th:src="${usuario != null and usuario.foto != null and !#strings.isEmpty(usuario.foto)} ? ${usuario.foto} : 'https://ssl.gstatic.com/accounts/ui/avatar_2x.png'"
                                    alt="Foto de perfil" width="40" height="40"
                                    class="rounded-circle border border-2 border-primary object-fit-cover">
                            </a>

                            <ul class="dropdown-menu shadow border-0 mt-2" aria-labelledby="dropdownUser1">
                                <li>
                                    <h6 class="dropdown-header" th:text="${usuario?.username}">Nombre
                                        Usuario</h6>
                                </li>
                                <li>
                                    <hr class="dropdown-divider">
                                </li>
                                <li>
                                    <a class="dropdown-item" th:href="@{/editarInstructor/{dni}(dni=${usuario?.dni})}">
                                        <i class="bi bi-person-circle me-2"></i>Editar perfil
                                    </a>
                                </li>
                                <li>
                                    <form th:action="@{/logout}" method="post">
                                        <button type="submit" class="dropdown-item text-danger">
                                            <i class="bi bi-box-arrow-right me-2"></i>Cerrar
                                            sesión
                                        </button>
                                    </form>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
        <script>
            document.addEventListener('click', function (event) {
                const toggle = event.target.closest('#dropdownUser1');
                const menu = document.querySelector('[aria-labelledby="dropdownUser1"]');

                if (!menu) {
                    return;
                }

                if (toggle) {
                    event.preventDefault();
                    menu.classList.toggle('show');
                    toggle.setAttribute('aria-expanded', menu.classList.contains('show'));
                    return;
                }

                menu.classList.remove('show');
                const currentToggle = document.getElementById('dropdownUser1');
                if (currentToggle) {
                    currentToggle.setAttribute('aria-expanded', 'false');
                }
            });
        </script>
    </header>
</body>

</html>
