<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
   <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Elección de Cuenta</title>
</head>

<body class="bg-light d-flex align-items-center min-vh-100">

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
               
                <div class="card shadow-sm border-0 p-4 text-center">
                    <div class="card-body">
                        <i class="bi bi-person-check fs-1 text-primary mb-3"></i>
                        <h2 class="fw-bold mb-4">¿Quién eres?</h2>
                        <p class="text-muted mb-4">Selecciona el tipo de cuenta para comenzar tu registro en CoursePlanner.</p>
                        
                        <div class="d-grid gap-3">
                            <a th:href="@{/anadirestudiante}" class="btn btn-outline-primary btn-lg shadow-sm py-3 fw-bold">
                                <i class="bi bi-mortarboard-fill me-2"></i> Soy Estudiante
                            </a>
                            <a th:href="@{/crearInstructor}" class="btn btn-success btn-lg shadow-sm py-3 fw-bold text-white">
                                <i class="bi bi-person-video3 me-2"></i> Soy Instructor
                            </a>
                        </div>
                        
                        <div class="mt-4">
                            <a th:href="@{/}" class="text-decoration-none text-secondary small">Volver al inicio</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
