<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar Inscripciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">

    <div th:replace="~{fragments/cabeceraAdmin :: cabeceraAdmin}"></div>

    <main class="container py-5">
        <h2 class="mb-4">Gestionar Inscripciones del Curso</h2>
        
        <div class="card shadow-sm border-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Estudiante</th>
                        <th>Estado</th>
                        <th>Progreso (%)</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="inscripcion : ${inscripciones}">
                        <td th:text="${inscripcion.estudiante.username}">Nombre</td>
                        
                        <td colspan="3">
                            <form th:action="@{/admin/inscripciones/editar}" method="post" class="row g-2">
                                <input type="hidden" name="estudianteDni" th:value="${inscripcion.estudiante.dni}">
                                <input type="hidden" name="cursoId" th:value="${inscripcion.curso.id}">
                                
                                <div class="col">
                                    <select name="estado" class="form-select form-select-sm">
                                        <option th:each="e : ${T(com.salesianostriana.dam.courserplanner.modelo.EstadoInscripcion).values()}"
                                                th:value="${e}" th:text="${e}" 
                                                th:selected="${e == inscripcion.estado}"></option>
                                    </select>
                                </div>
                                <div class="col">
                                    <input type="number" name="progreso" class="form-control form-control-sm" 
                                           th:value="${inscripcion.progreso}" min="0" max="100">
                                </div>
                                <div class="col">
                                    <button type="submit" class="btn btn-success btn-sm w-100">Guardar</button>
                                </div>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="mt-4">
            <a th:href="@{/admin/misCursos}" class="btn btn-secondary">Volver</a>
        </div>
    </main>

   
</body>
</html>
